name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Build core
        run: pnpm --filter @promptrev/core build

      - name: Typecheck vscode
        run: pnpm --filter './packages/vscode' typecheck

      - name: Build vscode
        run: pnpm --filter './packages/vscode' build

      - name: Test core
        run: pnpm --filter @promptrev/core test

      - name: Build CLI
        run: pnpm --filter promptrev build

      - name: Typecheck CLI
        run: pnpm --filter promptrev typecheck

      - name: Test CLI
        run: pnpm --filter promptrev test

      - name: Package VSIX (dry run)
        run: pnpm --filter './packages/vscode' package
        continue-on-error: true
